name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Run type checking
        run: aube run typecheck

      - name: Build site
        run: aube run build
        env:
          NODE_ENV: production

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Check Prettier formatting
        run: aube dlx prettier --check "**/*.{js,jsx,ts,tsx,md,json,yml,yaml}"

      - name: Run ESLint
        run: aube dlx eslint . --ext .js,.jsx,.ts,.tsx

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Run aube security audit
        run: aube audit --prod --audit-level moderate
